<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NextLevelDesk</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="tap-overlay">Tap to start audio<br><small>iOS: silent switch mutes Web Audio</small></div>
<header>
  <h1>NextLevelDesk</h1>
  <div id="status">Loading samples…</div>
</header>
<section class="controls">
  <label>BPM <input id="bpm" type="number" min="60" max="180" value="92"></label>
  <label>Key <select id="key"><option>A minor</option><option>C major</option><option>G major</option><option>E minor</option><option>D major</option><option>B minor</option><option>A major</option><option>F major</option><option>D minor</option><option>Bb major</option><option>G minor</option></select></label>
  <label>Chords <input id="chords" value="Am F C G" placeholder="Am F C G"></label>
  <label>Bars <select id="bars"><option value="4">4</option><option value="8" selected>8</option></select></label>
  <label>Swing <input id="swing" type="range" min="0" max="60" value="0"> <span id="swing-val">0%</span></label>
  <div id="recipes"></div>
  <button id="play">Play</button>
  <button id="stop">Stop</button>
  <button id="export-wav">Export WAV (folded)</button>
  <button id="export-tail">Export WAV (with tail)</button>
  <button id="export-midi">Export MIDI</button>
</section>
<div id="playhead-wrap"><div id="playhead"></div></div>
<section id="grids"></section>
<div id="punch"></div>
<script src="app.js"></script>
</body>
</html>
